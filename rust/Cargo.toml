[package]
name = "reman"
version = "0.3.2"
edition = "2024"
description = "Your shell history, searchable by meaning, with proof of what worked. For you and your AI agents."
license = "Apache-2.0"
repository = "https://github.com/rdarshan10/reman"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
ratatui = "0.30.2"
unicode-width = "0.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
# OpenAI-compatible model calls (already in the tree via the model downloader)
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true
