# Builds and tests reman on Windows, macOS (Apple Silicon) and Linux on every push and pull request,
# so code that only compiles on one of them (a shell's terminal layer, a key reader) is caught before
# a release is tagged.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        shell: bash
        # a failing test also becomes an annotation: readable through the API without signing in
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee test.log || {
            grep -E "panicked at|^test .* FAILED|^error|assertion|left:|right:" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Build
        run: cargo build --release
