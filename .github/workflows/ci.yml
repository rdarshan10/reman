# Builds and tests reman on Windows, macOS (Apple Silicon) and Linux on every push and pull request,
# so code that only compiles on one of them (a shell's terminal layer, a key reader) is caught before
# a release is tagged.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
