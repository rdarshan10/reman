# Builds reman for Windows, macOS (Apple Silicon) and Linux, runs the tests, and publishes
# the archives to a GitHub Release when a version tag (v*) is pushed. Run it by hand (Actions tab,
# "Run workflow") to build and test without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: reman-windows-x64, test: true }
          # Apple Silicon only: ONNX Runtime publishes no prebuilt library for Intel Macs
          - { os: macos-latest, target: aarch64-apple-darwin, name: reman-macos-arm64, test: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: reman-linux-x64, test: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "dist/${{ matrix.name }}"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/reman.exe", "target/${{ matrix.target }}/release/reman-hook.exe" $d
          Copy-Item ../README.md $d
          Compress-Archive -Path "$d/*" -DestinationPath "dist/${{ matrix.name }}.zip"

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          d=dist/${{ matrix.name }}
          mkdir -p "$d"
          cp target/${{ matrix.target }}/release/reman target/${{ matrix.target }}/release/reman-hook ../README.md "$d/"
          tar -C dist -czf dist/${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            rust/dist/${{ matrix.name }}.zip
            rust/dist/${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Add the install scripts
        run: cp install.ps1 install.sh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
